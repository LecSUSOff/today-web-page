<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified | Today</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0c10; 
            color: #f5f5f7; 
            letter-spacing: -0.01em; 
            overflow-x: hidden; 
        }
        
        /* Interactive Brand Spotlight Effect */
        #spotlight {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background: radial-gradient(circle 350px at var(--x, 50%) var(--y, 50%), rgba(99, 102, 241, 0.12), transparent 100%);
        }

        /* Fluid Entry Reveal Animation */
        .reveal { 
            opacity: 0; 
            transform: translateY(20px); 
            animation: revealIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes revealIn { to { opacity: 1; transform: translateY(0); } }

        .app-mockup-frame { 
            width: 100%; 
            max-width: 260px; 
            border-radius: 24px; 
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .app-mockup-frame:hover { transform: scale(1.03) translateY(-4px); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen relative">
    <div id="spotlight" class="hidden md:block"></div>

    <main class="flex-grow flex flex-col items-center justify-center px-6 py-16 text-center z-20">
        
        <div class="reveal mb-8">
            <img src="pictures/today_tab.png" alt="Today App Feed Screen" class="app-mockup-frame">
        </div>

        <div class="reveal" style="animation-delay: 0.15s">
            <div class="flex items-center justify-center gap-2.5 mb-6 bg-white/5 border border-white/10 px-4 py-1.5 rounded-full w-fit mx-auto">
                <img src="logo.png" alt="Today App Logo" class="w-5 h-5 object-contain rounded">
                <span class="font-semibold text-sm tracking-tight text-neutral-200">Today</span>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tighter bg-gradient-to-r from-white to-neutral-400 bg-clip-text text-transparent" data-i18n="success-title">
                Email Verified
            </h1>
            
            <p class="text-base md:text-lg text-neutral-400 font-normal max-w-sm mx-auto mb-8 px-2" data-i18n="success-subtitle">
                Everything is ready. You can now return to the app to start your journey.
            </p>

            <div class="flex flex-col items-center">
                <a href="index.html" class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:opacity-90 text-white font-medium px-6 py-2.5 rounded-full transition-all shadow-lg shadow-indigo-500/20 text-sm" data-i18n="back-home">
                    &larr; Back to homepage
                </a>
            </div>
        </div>
    </main>

    <footer class="py-10 border-t border-white/5 flex flex-col items-center gap-3 text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] z-20 bg-[#0b0c10]">
        <div class="flex gap-6">
            <a href="privacy.html" class="hover:text-neutral-200 transition-colors" data-i18n="nav-privacy">Privacy</a>
            <a href="https://github.com/lecsusoff" target="_blank" rel="noopener noreferrer" class="hover:text-neutral-200 transition-colors">GitHub</a>
        </div>
        <span class="text-neutral-600 normal-case font-normal" data-i18n="footer-copy">© 2026 Today Journal • Flutter + Supabase</span>
    </footer>

    <script>
        const translations = {
            en: {
                "success-title": "Email Verified",
                "success-subtitle": "Everything is ready. You can now return to your app to start tracking your history.",
                "back-home": "Go to homepage",
                "nav-privacy": "Privacy",
                "footer-copy": "© 2026 Today Journal • Flutter + Supabase"
            },
            ru: {
                "success-title": "Почта подтверждена",
                "success-subtitle": "Всё готово. Теперь вы можете вернуться в приложение, чтобы начать вести свои записи.",
                "back-home": "На главную страницу",
                "nav-privacy": "Приватность",
                "footer-copy": "© 2026 Today Journal • Flutter + Supabase"
            }
        };

        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        const savedLang = localStorage.getItem('preferred-lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en');
        setLanguage(savedLang);

        const spotlight = document.getElementById('spotlight');
        window.addEventListener('mousemove', e => {
            spotlight.style.setProperty('--x', e.clientX + 'px');
            spotlight.style.setProperty('--y', e.clientY + 'px');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified | Today</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #1a1a1a; letter-spacing: -0.01em; overflow-x: hidden; }
        
        /* Spotlight Effect (Identical to your main page) */
        #spotlight {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            background: radial-gradient(circle 200px at var(--x) var(--y), rgba(63, 81, 181, 0.04), transparent 100%);
        }

        /* Reveal Animation */
        .reveal { opacity: 0; transform: translateY(30px); animation: revealIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes revealIn { to { opacity: 1; transform: translateY(0); } }

        .app-mockup-frame { 
            width: 100%; 
            max-width: 320px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            transition: transform 0.5s ease;
        }
        .app-mockup-frame:hover { transform: scale(1.02); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">
    <div id="spotlight" class="hidden md:block"></div>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-16 text-center">
        
        <!-- App Image Mockup (Using your existing assets) -->
        <div class="reveal mb-12">
            <img src="pictures/today_tab.png" alt="Today App" class="app-mockup-frame">
        </div>

        <div class="reveal" style="animation-delay: 0.2s">
            <div class="flex items-center justify-center gap-3 mb-6">
                <img src="logo.png" alt="Today Logo" class="w-7 h-7">
                <span class="font-bold text-lg tracking-tight">Today</span>
            </div>
            
            <h1 class="text-5xl md:text-6xl font-black mb-4 tracking-tighter" data-i18n="success-title">
                Email Verified
            </h1>
            
            <p class="text-xl text-neutral-500 font-medium leading-tight max-w-sm mx-auto mb-10" data-i18n="success-subtitle">
                Everything is ready. You can now return to the app to start your journey.
            </p>

            <div class="flex flex-col items-center gap-4">
                <a href="index.html" class="text-indigo-600 font-bold text-lg hover:text-indigo-800 transition-colors" data-i18n="back-home">
                    &larr; Back to homepage
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t border-neutral-100 flex flex-col items-center gap-4 text-[10px] font-black text-neutral-300 uppercase tracking-[0.2em]">
        <div class="flex gap-8">
            <a href="privacy.html" class="hover:text-black transition-colors" data-i18n="nav-privacy">Privacy</a>
            <a href="https://github.com/lecsusoff" class="hover:text-black transition-colors">GitHub</a>
        </div>
        <span data-i18n="footer-copy">© 2026 Today Journal • Flutter + Supabase</span>
    </footer>

    <script>
        // Multi-language support (Logic identical to your main page)
        const translations = {
            en: {
                "success-title": "Verified",
                "success-subtitle": "Your account is active. You can now return to the app.",
                "back-home": "Go to homepage",
                "nav-privacy": "Privacy",
                "footer-copy": "© 2026 Today Journal • Flutter + Supabase"
            },
            ru: {
                "success-title": "Готово",
                "success-subtitle": "Почта подтверждена. Теперь вы можете вернуться в приложение.",
                "back-home": "На главную",
                "nav-privacy": "Приватность",
                "footer-copy": "© 2026 Today Journal • Flutter + Supabase"
            }
        };

        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
        }

        const savedLang = localStorage.getItem('preferred-lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en');
        setLanguage(savedLang);

        // Spotlight Logic
        window.addEventListener('mousemove', e => {
            document.body.style.setProperty('--x', e.clientX + 'px');
            document.body.style.setProperty('--y', e.clientY + 'px');
        });
    </script>
</body>
</html>
